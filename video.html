<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>RippleFlow spike: video</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #wrap { padding: 16px; max-width: 760px; }
      button { font-size: 18px; padding: 14px 22px; margin: 12px 8px 8px 0; border-radius: 10px; border: 0; background: #2a5bd7; color: #fff; }
      button:disabled { opacity: 0.5; }
      input[type=file] { font-size: 16px; margin: 8px 0; }
      pre { font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <h2>Video into WebGPU spike</h2>
      <p>Decodes the clip with WebCodecs, uploads frames to a GPU texture three ways, and checks seeking is frame-accurate.</p>
      <div>Your own clip (optional): <input id="file" type="file" accept="video/*" /></div>
      <button id="run">Run test</button>
      <div id="status"></div>
      <pre id="out"></pre>
    </div>
    <script type="module" src="/src/spike/video.ts"></script>
  </body>
</html>
